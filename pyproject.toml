[project]
name = "datacube-compute"
dynamic = ["version"]
requires-python = ">=3.8"

[build-system]
requires = [
    "setuptools",
    "wheel",
    "setuptools-rust",
    "setuptools_scm[toml]>=3.4",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "datacube_compute/_version.py"

[tool.poetry]
name = "datacube-compute"
version = "0.0.1"
description = ""
authors = []
